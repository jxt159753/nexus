<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  NEXUS — boot sequence
 *  A deterministic canvas animation: every pixel is a function of t.
 *  1920×1080 design space, letterboxed to any viewport.
 * ------------------------------------------------------------------ */

const W = 1920, H = 1080;
const CX = 960;

// hero layout (same aspect ratio as the source signature)
const MARK = { x: 646.5, y: 236, w: 627, h: 500 };
const WORD = { x: 646.5, y: 770, w: 627, h: 58.4 };
const MARK_CX = MARK.x + MARK.w / 2;
const MARK_CY = MARK.y + MARK.h / 2;

// the four terminals of the mark, in design space
const NODES = [
  { x: 977.2, y: 263.9, label: 'N01', sub: 'UPLINK', lx: 1032, ly: 240, ax: 1013, ay: 253 },
  { x: 693.8, y: 499.3, label: 'N02', sub: 'EDGE',   lx: 606, ly: 466, ax: 676, ay: 489, align: 'right' },
  { x: 1225.6, y: 499.3, label: 'N03', sub: 'RELAY', lx: 1310, ly: 466, ax: 1243, ay: 489 },
  { x: 977.2, y: 669.9, label: 'N04', sub: 'CORE',  lx: 1032, ly: 706, ax: 1000, ay: 685 }
];

const TL = {
  power: 0.02,
  hud: 0.30,
  grid: 0.18,
  rings: 0.22,
  traces: 0.30,
  nodes: 0.62,
  edges: 0.72,
  assemble: 0.94,
  charge: 1.80,
  sweep: 2.38,
  lock: 2.14,
  shine: 2.24,
  word: 2.58,
  tagline: 3.28,
  glitch: 3.95,
  hold: 4.20,
  fade: 6.95,
  end: 7.40
};
const DUR = 7.40;
const BUILD = '7.2.0';

/* ------------------------------- utils ---------------------------- */

const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInCubic = t => Math.pow(clamp(t), 3);
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOutExpo = t => { t = clamp(t); return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); };
const hash1 = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const pad2 = n => String(n).padStart(2, '0');

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function tracked(ctx, text, x, y, tracking, align = 'left') {
  const chars = Array.from(text);
  const widths = chars.map(c => ctx.measureText(c).width);
  const total = widths.reduce((a, b) => a + b, 0) + tracking * Math.max(0, chars.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  for (let i = 0; i < chars.length; i++) {
    ctx.fillText(chars[i], cx, y);
    cx += widths[i] + tracking;
  }
}

function polyLength(pts) {
  let d = 0;
  for (let i = 1; i < pts.length; i++) d += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return d;
}

function polyPoint(pts, dist) {
  let left = dist;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
    const len = Math.hypot(dx, dy);
    if (left <= len) {
      const k = len === 0 ? 0 : left / len;
      return [pts[i - 1][0] + dx * k, pts[i - 1][1] + dy * k];
    }
    left -= len;
  }
  return pts[pts.length - 1];
}

function strokePolyPartial(ctx, pts, progress) {
  const total = polyLength(pts);
  const target = total * clamp(progress);
  let acc = 0;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
    const len = Math.hypot(dx, dy);
    if (acc + len <= target) {
      ctx.lineTo(pts[i][0], pts[i][1]);
      acc += len;
    } else {
      const k = len === 0 ? 0 : (target - acc) / len;
      ctx.lineTo(pts[i - 1][0] + dx * k, pts[i - 1][1] + dy * k);
      break;
    }
  }
  ctx.stroke();
}

/* ------------------------------- assets --------------------------- */

const IMAGES = {};
const T = {}; // pre-rendered, tinted / blurred layers

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Failed to load ' + src));
    img.src = src;
  });
}

function tinted(img, color, w, h) {
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height);
  return c;
}

function makeGlow() {
  const pad = 90;
  const c = document.createElement('canvas');
  c.width = MARK.w + pad * 2; c.height = MARK.h + pad * 2;
  const g = c.getContext('2d');
  g.filter = 'blur(20px)';
  g.globalAlpha = 1;
  g.drawImage(IMAGES.mark, pad, pad, MARK.w, MARK.h);
  g.filter = 'blur(8px)';
  g.globalAlpha = 0.55;
  g.drawImage(IMAGES.mark, pad, pad, MARK.w, MARK.h);
  g.filter = 'none';
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = 'rgb(112, 228, 250)';
  g.fillRect(0, 0, c.width, c.height);
  return { canvas: c, pad };
}

function makeGrid() {
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const step = 48;
  for (let y = step; y < H; y += step) {
    for (let x = step; x < W; x += step) {
      const nx = (x - CX) / 980, ny = (y - 505) / 560;
      const d = Math.hypot(nx, ny);
      const a = 0.14 * Math.pow(Math.max(0, 1 - d * 0.95), 2.1);
      if (a < 0.004) continue;
      g.fillStyle = `rgba(128, 222, 238, ${a.toFixed(4)})`;
      g.beginPath(); g.arc(x, y, 0.85, 0, 6.2832); g.fill();
    }
  }
  // a few heavier calibration crosses
  g.strokeStyle = 'rgba(120, 220, 240, .05)';
  g.lineWidth = 1;
  for (let y = 120; y < H; y += 240) {
    for (let x = 120; x < W; x += 240) {
      const nx = (x - CX) / 900, ny = (y - 505) / 520;
      if (Math.hypot(nx, ny) > 0.95) continue;
      g.beginPath();
      g.moveTo(x - 4, y + .5); g.lineTo(x + 5, y + .5);
      g.moveTo(x + .5, y - 4); g.lineTo(x + .5, y + 5);
      g.stroke();
    }
  }
  return c;
}

function makeNoise() {
  const size = 180;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size);
  const rnd = mulberry32(99117);
  for (let i = 0; i < size * size; i++) {
    const v = rnd() > 0.5 ? 255 : 0;
    img.data[i * 4] = v;
    img.data[i * 4 + 1] = v;
    img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = Math.floor(rnd() * 36);
  }
  g.putImageData(img, 0, 0);
  return c;
}

function makeScanlines() {
  const c = document.createElement('canvas');
  c.width = 1; c.height = 4;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,.055)';
  g.fillRect(0, 0, 1, 1);
  return c;
}

/* ------------------------------- state ---------------------------- */

const cv = document.getElementById('stage');
const out = cv.getContext('2d', { alpha: false });
const scene = document.createElement('canvas');
scene.width = W; scene.height = H;
const s = scene.getContext('2d', { alpha: false });

const view = { s: 1, ox: 0, oy: 0, dpr: 1 };

const DUST = [];
const SPARKS = [];
const rnd = mulberry32(20261020);

for (let i = 0; i < 84; i++) {
  DUST.push({
    x: rnd() * W,
    y: rnd() * H,
    r: 0.35 + rnd() * 1.25,
    speed: 2 + rnd() * 9,
    phase: rnd() * 6.283,
    sway: 4 + rnd() * 13,
    tint: rnd()
  });
}
for (let i = 0; i < 92; i++) {
  SPARKS.push({
    angle: rnd() * 6.283,
    radius: 760 + rnd() * 620,
    tx: MARK.x + 20 + rnd() * (MARK.w - 40),
    ty: MARK.y + 20 + rnd() * (MARK.h - 40),
    delay: rnd() * 0.52,
    size: 0.7 + rnd() * 1.5,
    spin: rnd() * 6.283
  });
}

const TRACES = [
  [[-30, 322], [188, 322], [252, 386], [252, 536]],
  [[1950, 298], [1734, 298], [1668, 364], [1668, 472]],
  [[-30, 792], [156, 792], [218, 730], [540, 730]],
  [[1950, 848], [1784, 848], [1722, 786], [1452, 786]]
];

/* ------------------------------ drawing --------------------------- */

function drawBackdrop(t, master) {
  s.fillStyle = '#030405';
  s.fillRect(0, 0, W, H);

  const lift = smooth((t - 0.1) / 1.1) * master;
  let g = s.createRadialGradient(CX, 505, 30, CX, 505, 990);
  g.addColorStop(0, `rgba(12, 40, 48, ${0.40 * lift})`);
  g.addColorStop(0.42, `rgba(6, 18, 23, ${0.28 * lift})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  s.fillStyle = g;
  s.fillRect(0, 0, W, H);

  // slow breathing halo behind the mark
  const halo = smooth((t - 1.0) / 1.4);
  if (halo > 0) {
    const breathe = 0.55 + 0.15 * Math.sin((t - 1.2) * 1.35);
    g = s.createRadialGradient(MARK_CX, MARK_CY, 30, MARK_CX, MARK_CY, 560);
    g.addColorStop(0, `rgba(40, 150, 172, ${0.052 * halo * breathe})`);
    g.addColorStop(0.55, `rgba(20, 90, 105, ${0.028 * halo * breathe})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    s.fillStyle = g;
    s.fillRect(0, 0, W, H);
  }

  // CRT vignette
  g = s.createRadialGradient(CX, 520, 300, CX, 520, 1180);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.62, 'rgba(0,0,0,0.14)');
  g.addColorStop(1, 'rgba(0,0,0,0.72)');
  s.fillStyle = g;
  s.fillRect(0, 0, W, H);
}

function drawPowerLine(t, master) {
  const p = clamp((t - TL.power) / 0.38);
  if (p <= 0 || p >= 1) return;
  const a = Math.sin(p * Math.PI) * master;
  const w = 30 + easeOutCubic(p) * 560;
  s.save();
  s.globalCompositeOperation = 'screen';

  const g = s.createLinearGradient(CX - w / 2, 0, CX + w / 2, 0);
  g.addColorStop(0, 'rgba(110, 235, 255, 0)');
  g.addColorStop(0.5, `rgba(235, 255, 255, ${0.8 * a})`);
  g.addColorStop(1, 'rgba(110, 235, 255, 0)');
  s.fillStyle = g;
  s.fillRect(CX - w / 2, 538, w, 1.8);

  s.fillStyle = `rgba(120,240,255,${0.28 * a})`;
  s.fillRect(CX - w * 0.16, 536.4, w * 0.32, 5);

  // vertical ignition stroke
  const vh = 120 * Math.sin(p * Math.PI);
  const vg = s.createLinearGradient(0, 500 - vh, 0, 500 + vh);
  vg.addColorStop(0, 'rgba(140,240,255,0)');
  vg.addColorStop(0.5, `rgba(220,252,255,${0.22 * a})`);
  vg.addColorStop(1, 'rgba(140,240,255,0)');
  s.fillStyle = vg;
  s.fillRect(CX - 0.5, 500 - vh, 1, vh * 2);

  // centre flare
  const fg = s.createRadialGradient(CX, 500, 0, CX, 500, 95);
  fg.addColorStop(0, `rgba(255,255,255,${0.5 * a})`);
  fg.addColorStop(0.22, `rgba(170,248,255,${0.22 * a})`);
  fg.addColorStop(1, 'rgba(100,225,255,0)');
  s.fillStyle = fg;
  s.beginPath(); s.arc(CX, 500, 95, 0, 6.2832); s.fill();
  s.restore();
}

function drawGrid(t, master) {
  if (!T.grid) return;
  const p = smooth((t - TL.grid) / 1.0);
  if (p <= 0) return;
  s.save();
  s.globalAlpha = p * 0.9 * master;
  const drift = Math.sin(t * 0.12) * 4;
  s.drawImage(T.grid, drift, drift * 0.4);
  s.restore();
}

function drawRings(t, master) {
  const p = smooth((t - TL.rings) / 1.2);
  if (p <= 0) return;
  const fade = 1 - smooth((t - TL.fade) / 0.35);
  const a = p * fade * master;
  s.save();
  s.translate(CX, 486);

  // four broken arcs
  s.rotate(t * 0.028);
  s.strokeStyle = `rgba(96, 222, 242, ${0.115 * a})`;
  s.lineWidth = 1;
  for (let k = 0; k < 4; k++) {
    const grow = smooth((t - TL.rings - k * 0.09) / 0.9);
    if (grow <= 0) continue;
    const start = k * Math.PI / 2 + 0.24;
    s.beginPath();
    s.arc(0, 0, 352, start, start + 1.02 * grow);
    s.stroke();
  }

  // outer dashed ring
  s.rotate(-t * 0.052);
  s.setLineDash([1.5, 12]);
  s.strokeStyle = `rgba(96, 210, 232, ${0.085 * a})`;
  s.beginPath(); s.arc(0, 0, 414, 0, 6.2832); s.stroke();
  s.setLineDash([]);

  // tick ring
  for (let i = 0; i < 72; i++) {
    const ang = i * Math.PI / 36 + t * 0.012;
    const major = i % 6 === 0;
    const r1 = 438;
    const r2 = major ? 450 : 444;
    s.strokeStyle = `rgba(120, 226, 242, ${(major ? 0.10 : 0.045) * a})`;
    s.beginPath();
    s.moveTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
    s.lineTo(Math.cos(ang) * r2, Math.sin(ang) * r2);
    s.stroke();
  }
  s.restore();
}

function drawTraces(t, master) {
  const fade = 1 - smooth((t - TL.fade) / 0.35);
  s.save();
  s.globalCompositeOperation = 'screen';
  for (let i = 0; i < TRACES.length; i++) {
    const pts = TRACES[i];
    const p = easeInOut(clamp((t - TL.traces - i * 0.085) / 0.95));
    if (p <= 0) continue;
    s.strokeStyle = `rgba(92, 214, 236, ${0.16 * fade * master})`;
    s.lineWidth = 1.15;
    strokePolyPartial(s, pts, p);
    const tip = polyPoint(pts, polyLength(pts) * p);
    const twinkle = 0.5 + 0.5 * Math.sin(t * 4 + i * 1.7);
    s.fillStyle = `rgba(190, 250, 255, ${(0.35 + 0.3 * twinkle) * fade * master})`;
    s.beginPath(); s.arc(tip[0], tip[1], 1.6, 0, 6.2832); s.fill();

    // travelling data pulse
    const flow = (t * 0.16 + i * 0.31) % 1;
    if (t > 3.0 && flow > 0.02 && flow < 0.98) {
      const pos = polyPoint(pts, polyLength(pts) * flow);
      s.globalAlpha = Math.sin(flow * Math.PI) * 0.55 * fade * master;
      s.fillStyle = 'rgba(180, 250, 255, .9)';
      s.beginPath(); s.arc(pos[0], pos[1], 1.9, 0, 6.2832); s.fill();
      s.globalAlpha = 1;
    }

    if (p > 0.98) {
      const end = pts[pts.length - 1];
      s.strokeStyle = `rgba(120, 228, 244, ${0.28 * fade * master})`;
      s.lineWidth = 1;
      s.strokeRect(end[0] - 2.2, end[1] - 2.2, 4.4, 4.4);
    }
  }
  s.restore();
}

function drawCore(t, master) {
  if (t < 0.10 || t > 1.50) return;
  const p = smooth((t - 0.10) / 0.45);
  const fade = 1 - smooth((t - 1.02) / 0.4);
  const a = p * fade * master;
  if (a <= 0.002) return;
  const pulse = 0.78 + 0.22 * Math.sin(t * 7.2);

  s.save();
  s.globalCompositeOperation = 'screen';

  const g = s.createRadialGradient(960, 500, 0, 960, 500, 100);
  g.addColorStop(0, `rgba(245,255,255,${0.55 * a * pulse})`);
  g.addColorStop(0.12, `rgba(150,246,255,${0.30 * a})`);
  g.addColorStop(0.5, `rgba(70,210,240,${0.08 * a})`);
  g.addColorStop(1, 'rgba(70,210,240,0)');
  s.fillStyle = g;
  s.beginPath(); s.arc(960, 500, 100, 0, 6.2832); s.fill();

  s.fillStyle = `rgba(255,255,255,${0.9 * a * pulse})`;
  s.beginPath(); s.arc(960, 500, 1.8 + 0.7 * Math.sin(t * 9), 0, 6.2832); s.fill();

  const ping = clamp((t - 0.28) / 0.85);
  if (ping > 0 && ping < 1) {
    s.strokeStyle = `rgba(140, 242, 255, ${0.3 * (1 - ping) * a})`;
    s.lineWidth = 1;
    s.beginPath(); s.arc(960, 500, 12 + easeOutCubic(ping) * 160, 0, 6.2832); s.stroke();
  }

  s.strokeStyle = `rgba(160, 246, 255, ${0.20 * a})`;
  s.beginPath();
  s.moveTo(960 - 132, 500); s.lineTo(960 - 34, 500);
  s.moveTo(960 + 34, 500); s.lineTo(960 + 132, 500);
  s.stroke();
  s.restore();
}

function drawDust(t, master) {
  const p = smooth((t - TL.grid) / 1.2);
  if (p <= 0) return;
  s.save();
  s.globalCompositeOperation = 'screen';
  for (const d of DUST) {
    const y = ((d.y - t * d.speed) % H + H) % H;
    const x = d.x + Math.sin(t * 0.22 + d.phase) * d.sway;
    const a = (0.05 + 0.11 * (0.5 + 0.5 * Math.sin(t * 1.15 + d.phase * 2.3))) * p * master;
    s.fillStyle = d.tint > 0.72 ? `rgba(150, 245, 255, ${a})` : `rgba(225, 246, 250, ${a * 0.8})`;
    s.beginPath(); s.arc(x, y, d.r, 0, 6.2832); s.fill();
  }
  s.restore();
}

function drawSparks(t, master) {
  const start = 0.94, span = 0.72;
  if (t < start || t > start + span + 0.55) return;
  s.save();
  s.globalCompositeOperation = 'screen';
  for (const p of SPARKS) {
    const q = clamp((t - start - p.delay) / span);
    if (q <= 0 || q >= 1) continue;
    const e = q * q * q;
    const dist = p.radius * (1 - e);
    const x = p.tx + Math.cos(p.angle) * dist;
    const y = p.ty + Math.sin(p.angle) * dist * 0.74;
    const a = Math.sin(q * Math.PI) * 0.62 * master;
    const tail = 16 + 34 * (1 - q);
    s.strokeStyle = `rgba(150, 242, 255, ${a * 0.45})`;
    s.lineWidth = 0.8;
    s.beginPath();
    s.moveTo(x + Math.cos(p.angle) * tail, y + Math.sin(p.angle) * tail * 0.74);
    s.lineTo(x, y);
    s.stroke();
    s.fillStyle = `rgba(225, 253, 255, ${a})`;
    s.beginPath(); s.arc(x, y, p.size, 0, 6.2832); s.fill();
  }
  s.restore();
}

function drawNodeMarkers(t, master) {
  const inA = smooth((t - TL.nodes) / 0.5);
  const outA = 1 - smooth((t - 2.02) / 0.3);
  const a = inA * outA * master;
  if (a <= 0) return;

  s.save();
  s.globalCompositeOperation = 'screen';
  for (let i = 0; i < NODES.length; i++) {
    const n = NODES[i];
    const ignite = clamp((t - TL.nodes - i * 0.13) / 0.42);
    if (ignite <= 0) continue;
    const ia = a * smooth(ignite);

    // static ring + corner ticks
    s.strokeStyle = `rgba(120, 232, 250, ${0.30 * ia})`;
    s.lineWidth = 1;
    s.beginPath(); s.arc(n.x, n.y, 44, 0, 6.2832); s.stroke();
    for (let k = 0; k < 4; k++) {
      const ang = Math.PI / 4 + k * Math.PI / 2;
      s.beginPath();
      s.moveTo(n.x + Math.cos(ang) * 48, n.y + Math.sin(ang) * 48);
      s.lineTo(n.x + Math.cos(ang) * 56, n.y + Math.sin(ang) * 56);
      s.stroke();
    }
    s.fillStyle = `rgba(170, 246, 255, ${0.7 * ia})`;
    s.beginPath(); s.arc(n.x, n.y, 1.8, 0, 6.2832); s.fill();

    // ignition ping
    const ping = clamp((t - TL.nodes - i * 0.13) / 0.75);
    if (ping > 0 && ping < 1) {
      s.strokeStyle = `rgba(140, 240, 255, ${0.4 * (1 - ping) * ia})`;
      s.beginPath(); s.arc(n.x, n.y, 44 + easeOutCubic(ping) * 88, 0, 6.2832); s.stroke();
    }

    // labels
    if (t > 0.86 && t < 2.16) {
      s.save();
      s.font = '400 8.5px "Cascadia Mono", Consolas, monospace';
      s.fillStyle = `rgba(150, 236, 248, ${0.32 * ia})`;
      s.strokeStyle = `rgba(120, 220, 238, ${0.22 * ia})`;
      s.lineWidth = 0.8;
      tracked(s, `${n.label} / ${n.sub}`, n.lx, n.ly, 1.2, n.align || 'left');
      s.beginPath(); s.moveTo(n.ax, n.ay); s.lineTo(n.lx + (n.align === 'right' ? 2 : -2), n.ly + 4); s.stroke();
      s.restore();
    }
  }
  s.restore();
}

function drawAssembly(t, master) {
  // blueprint edges
  const eA = smooth((t - TL.edges) / 0.4) * (1 - smooth((t - 1.96) / 0.32));
  if (eA > 0.002) {
    const flick = 0.78 + 0.22 * Math.sin(t * 57) * Math.sin(t * 19.3);
    s.save();
    s.globalCompositeOperation = 'screen';
    s.globalAlpha = eA * flick * 0.42 * master;
    s.drawImage(T.edges, MARK.x, MARK.y, MARK.w, MARK.h);
    s.restore();
  }

  // actual mark
  const start = TL.assemble;
  if (t < start) return;

  const app = smooth((t - start) / 0.18);
  const glowIn = smooth((t - start) / 0.85);
  const resting = t > TL.hold ? 0.30 + 0.035 * Math.sin((t - TL.hold) * 1.6) : 0.28;
  const glowA = glowIn * resting;

  s.save();

  // impact zoom / shake around the mark centre
  const dt = t - TL.lock;
  let scale = 1;
  if (dt > 0) {
    scale = 1 + 0.05 * (1 - smooth(dt / 0.5));
  }
  const shake = dt > 0 ? Math.sin(dt * 92) * 3.0 * Math.exp(-dt * 9) : 0;
  s.translate(MARK_CX + shake, MARK_CY);
  s.scale(scale, scale);
  s.translate(-MARK_CX, -MARK_CY);
  s.globalAlpha = 1;

  // halo
  if (T.glow && glowA > 0) {
    s.globalCompositeOperation = 'screen';
    s.globalAlpha = glowA * app * master;
    s.drawImage(T.glow.canvas, MARK.x - T.glow.pad, MARK.y - T.glow.pad);
    s.globalAlpha = 1;
    s.globalCompositeOperation = 'source-over';
  }

  // chromatic fringes on impact
  const cq = clamp((t - TL.lock) / 0.20);
  if (t >= TL.lock && cq < 1) {
    const off = 8 * (1 - cq);
    s.globalCompositeOperation = 'screen';
    s.globalAlpha = 0.45 * (1 - cq) * master;
    s.drawImage(T.markCyan, MARK.x - off, MARK.y, MARK.w, MARK.h);
    s.globalAlpha = 0.35 * (1 - cq) * master;
    s.drawImage(T.markMagenta, MARK.x + off, MARK.y, MARK.w, MARK.h);
    s.globalAlpha = 1;
    s.globalCompositeOperation = 'source-over';
  }

  if (t < 2.26) {
    const n = 40;
    const stripH = MARK.h / n;
    for (let i = 0; i < n; i++) {
      const norm = Math.abs(i - (n - 1) / 2) / ((n - 1) / 2);
      const delay = norm * 0.16 + hash1(i * 7.3) * 0.04;
      const p = easeOutCubic(clamp((t - start - delay) / 0.52));
      if (p <= 0) continue;
      const dir = i % 2 === 0 ? 1 : -1;
      const dx = (1 - p) * dir * (28 + hash1(i * 3.7) * 96);
      const dy = (1 - p) * (hash1(i * 9.1) - 0.5) * 22;
      const y = MARK.y + i * stripH;

      s.save();
      s.beginPath();
      s.rect(MARK.x - 220, y, MARK.w + 440, stripH + 0.55);
      s.clip();

      // faint motion ghost behind each slice
      if (p < 0.98) {
        s.globalAlpha = app * master * 0.18 * p;
        s.drawImage(IMAGES.mark, MARK.x + dx * 0.8, MARK.y + dy, MARK.w, MARK.h);
      }
      s.globalAlpha = app * master * clamp(p * 1.5);
      s.drawImage(IMAGES.mark, MARK.x + dx, MARK.y + dy, MARK.w, MARK.h);
      s.restore();
    }
    s.globalAlpha = 1;
  } else {
    s.globalAlpha = app * master;
    s.drawImage(IMAGES.mark, MARK.x, MARK.y, MARK.w, MARK.h);
    s.globalAlpha = 1;
  }

  s.restore();
}

function drawSlashCharge(t, master) {
  const p = clamp((t - TL.charge) / 0.34);
  if (p <= 0 || t > 2.46) return;
  const fadeOut = 1 - smooth((t - 2.16) / 0.26);
  const alpha = (p < 1 ? 1 : fadeOut) * master;
  if (alpha <= 0.002) return;

  const sx = 812, sy = 338, ex = 1122, ey = 672;
  const e = easeInOut(p);
  const hx = lerp(sx, ex, e), hy = lerp(sy, ey, e);

  s.save();
  s.globalCompositeOperation = 'screen';
  s.lineCap = 'round';

  if (p > 0.015) {
    const g = s.createLinearGradient(sx, sy, hx, hy);
    g.addColorStop(0, 'rgba(70, 215, 255, 0)');
    g.addColorStop(0.5, `rgba(90, 228, 255, ${0.16 * alpha})`);
    g.addColorStop(0.88, `rgba(170, 248, 255, ${0.46 * alpha})`);
    g.addColorStop(1, `rgba(255, 255, 255, ${0.9 * alpha})`);
    s.strokeStyle = g;
    s.lineWidth = 13;
    s.shadowColor = 'rgba(80, 230, 255, .8)';
    s.shadowBlur = 28;
    s.beginPath(); s.moveTo(sx, sy); s.lineTo(hx, hy); s.stroke();

    s.shadowBlur = 6;
    s.strokeStyle = `rgba(245, 255, 255, ${0.92 * alpha})`;
    s.lineWidth = 2;
    s.beginPath(); s.moveTo(sx, sy); s.lineTo(hx, hy); s.stroke();
  }

  // leading flare
  const fr = 46 + 18 * Math.sin(t * 37);
  const g2 = s.createRadialGradient(hx, hy, 0, hx, hy, fr);
  g2.addColorStop(0, `rgba(255,255,255,${0.55 * alpha})`);
  g2.addColorStop(0.2, `rgba(170,248,255,${0.28 * alpha})`);
  g2.addColorStop(1, 'rgba(80,220,255,0)');
  s.fillStyle = g2;
  s.beginPath(); s.arc(hx, hy, fr, 0, 6.2832); s.fill();

  for (let i = 0; i < 9; i++) {
    const ang = hash1(i * 5.1 + 2.2) * 6.2832;
    const rad = 6 + hash1(i * 2.7 + 9.4) * 34;
    const a = alpha * (0.25 + 0.55 * hash1(i * 8.3));
    s.fillStyle = `rgba(220, 253, 255, ${a})`;
    s.beginPath();
    s.arc(hx + Math.cos(ang) * rad, hy + Math.sin(ang) * rad, 0.7 + hash1(i) * 1.3, 0, 6.2832);
    s.fill();
  }
  s.restore();
}

function drawShine(t, master) {
  const runs = [
    { start: TL.shine, dur: 0.62, alpha: 0.95 },
    { start: 5.95, dur: 1.0, alpha: 0.42 }
  ];
  for (const run of runs) {
    const q = (t - run.start) / run.dur;
    if (q <= 0 || q >= 1 || !IMAGES.mark) continue;
    const a = Math.sin(q * Math.PI) * run.alpha * master;
    if (a <= 0.001) continue;

    const fx = T.fx, g = fx.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, fx.width, fx.height);
    g.drawImage(IMAGES.mark, 0, 0);
    g.globalCompositeOperation = 'source-in';

    const x0 = lerp(-700, 1400, q);
    const grad = g.createLinearGradient(x0, -150, x0 + 260, 900);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.44, 'rgba(190,250,255,0)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.95)');
    grad.addColorStop(0.56, 'rgba(190,250,255,0)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, fx.width, fx.height);

    s.save();
    s.globalCompositeOperation = 'screen';
    s.globalAlpha = a;
    s.drawImage(fx, MARK.x, MARK.y, MARK.w, MARK.h);
    s.restore();
  }
}

function drawWordmark(t, master) {
  if (t < TL.word) return;

  const wp = clamp((t - TL.word) / 0.72);
  const e = easeInOut(wp);
  const appear = smooth(wp * 2.2);
  const scale = 1 + 0.012 * (1 - e);
  const dw = WORD.w * scale;
  const dx = WORD.x - (dw - WORD.w) / 2;
  const dy = WORD.y + (1 - e) * 9;

  if (wp > 0) {
    s.save();
    s.beginPath();
    s.rect(WORD.x - 8, WORD.y - 26, WORD.w * e + 8, WORD.h + 52);
    s.clip();
    s.globalAlpha = (0.25 + 0.75 * appear) * master;
    s.shadowColor = `rgba(90, 226, 250, ${0.28 * appear})`;
    s.shadowBlur = 16;
    s.drawImage(IMAGES.word, dx, dy, dw, WORD.h * scale);
    s.shadowBlur = 0;
    s.restore();
  }

  // print head at the reveal edge
  if (wp > 0.03 && wp < 0.995) {
    const hx = WORD.x + WORD.w * e;
    const headA = appear * (1 - smooth((wp - 0.74) / 0.16)) * master;
    s.save();
    s.globalCompositeOperation = 'screen';

    const g = s.createLinearGradient(hx - 12, 0, hx + 8, 0);
    g.addColorStop(0, 'rgba(70, 215, 255, 0)');
    g.addColorStop(0.7, `rgba(90, 232, 255, ${0.14 * headA})`);
    g.addColorStop(0.96, `rgba(220, 252, 255, ${0.34 * headA})`);
    g.addColorStop(1, 'rgba(220, 252, 255, 0)');
    s.fillStyle = g;
    s.fillRect(hx - 12, WORD.y - 16, 20, WORD.h + 32);

    s.fillStyle = `rgba(235, 254, 255, ${0.8 * headA})`;
    s.fillRect(hx - 0.5, WORD.y - 12, 1, WORD.h + 24);

    // small cursor diamonds
    s.fillStyle = `rgba(200, 250, 255, ${0.55 * headA})`;
    s.beginPath();
    s.moveTo(hx, WORD.y - 19);
    s.lineTo(hx + 2.5, WORD.y - 16.5);
    s.lineTo(hx, WORD.y - 14);
    s.lineTo(hx - 2.5, WORD.y - 16.5);
    s.closePath(); s.fill();

    const fg = s.createRadialGradient(hx, WORD.y + WORD.h / 2, 0, hx, WORD.y + WORD.h / 2, 24);
    fg.addColorStop(0, `rgba(255,255,255,${0.20 * headA})`);
    fg.addColorStop(1, 'rgba(80,220,255,0)');
    s.fillStyle = fg;
    s.beginPath(); s.arc(hx, WORD.y + WORD.h / 2, 24, 0, 6.2832); s.fill();
    s.restore();
  }

  // underline
  const ul = smooth((t - (TL.word + 0.54)) / 0.5);
  if (ul > 0) {
    const w = 560 * ul;
    const y = 851;
    const g = s.createLinearGradient(CX - w / 2, 0, CX + w / 2, 0);
    g.addColorStop(0, 'rgba(90,220,240,0)');
    g.addColorStop(0.18, `rgba(120,236,252,${0.55 * master})`);
    g.addColorStop(0.5, `rgba(235,254,255,${0.9 * master})`);
    g.addColorStop(0.82, `rgba(120,236,252,${0.55 * master})`);
    g.addColorStop(1, 'rgba(90,220,240,0)');
    s.fillStyle = g;
    s.fillRect(CX - w / 2, y, w, 1.15);
    s.fillStyle = `rgba(235,254,255,${0.9 * master})`;
    s.fillRect(CX - 1.5, y - 1, 3, 3);
  }

  // tagline
  const tg = smooth((t - TL.tagline) / 0.55);
  if (tg > 0) {
    s.save();
    s.font = '300 11px "Cascadia Mono", Consolas, monospace';
    s.fillStyle = `rgba(196, 238, 246, ${0.50 * tg * master})`;
    tracked(s, 'CONNECTING THE UNCONNECTED', CX, 886, 4.6, 'center');
    s.restore();
  }
}

function drawSweep(t, master) {
  const p = clamp((t - TL.sweep) / 0.5);
  if (p > 0 && p < 1) {
    const y = lerp(150, 940, easeInOut(p));
    s.save();
    s.globalCompositeOperation = 'screen';
    const g = s.createLinearGradient(0, y - 70, 0, y + 70);
    g.addColorStop(0, 'rgba(80,210,235,0)');
    g.addColorStop(0.42, `rgba(80,210,235,${0.035 * master})`);
    g.addColorStop(0.5, `rgba(220,252,255,${0.085 * master})`);
    g.addColorStop(0.58, `rgba(80,210,235,${0.035 * master})`);
    g.addColorStop(1, 'rgba(80,210,235,0)');
    s.fillStyle = g;
    s.fillRect(0, y - 70, W, 140);
    s.fillStyle = `rgba(220,252,255,${0.12 * master})`;
    s.fillRect(0, y, W, 1);
    s.restore();
  }

  // slow ambient scan after the lock
  const p2 = clamp((t - 4.75) / 1.25);
  if (p2 > 0 && p2 < 1) {
    const y = lerp(-40, 1120, p2);
    s.save();
    s.globalCompositeOperation = 'screen';
    const g = s.createLinearGradient(0, y - 120, 0, y + 120);
    g.addColorStop(0, 'rgba(90,220,240,0)');
    g.addColorStop(0.5, `rgba(110,230,248,${0.035 * master})`);
    g.addColorStop(1, 'rgba(90,220,240,0)');
    s.fillStyle = g;
    s.fillRect(0, y - 120, W, 240);
    s.restore();
  }
}

function drawImpact(t, master) {
  const dt = t - TL.lock;
  if (dt < 0) return;
  const q = clamp(dt / 0.62);

  s.save();
  s.globalCompositeOperation = 'screen';

  if (q < 0.5) {
    const f = q / 0.5;
    const g = s.createRadialGradient(MARK_CX, MARK_CY, 10, MARK_CX, MARK_CY, 220 + 660 * f);
    g.addColorStop(0, `rgba(230,255,255,${0.34 * (1 - f) * master})`);
    g.addColorStop(0.35, `rgba(120,238,255,${0.13 * (1 - f) * master})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    s.fillStyle = g;
    s.fillRect(0, 0, W, H);
  }

  if (q < 1) {
    const r = 70 + easeOutCubic(q) * 820;
    s.strokeStyle = `rgba(170, 246, 255, ${0.42 * (1 - q) * master})`;
    s.lineWidth = 2.2 * (1 - q) + 0.35;
    s.beginPath(); s.arc(MARK_CX, MARK_CY, r, 0, 6.2832); s.stroke();
    s.strokeStyle = `rgba(255, 255, 255, ${0.20 * (1 - q) * master})`;
    s.lineWidth = 0.6;
    s.beginPath(); s.arc(MARK_CX, MARK_CY, r * 0.82, 0, 6.2832); s.stroke();
  }

  // horizontal lens streak
  if (q < 0.4) {
    const f = q / 0.4;
    const w = 300 + 1000 * easeOutCubic(f);
    const g = s.createLinearGradient(CX - w / 2, 0, CX + w / 2, 0);
    g.addColorStop(0, 'rgba(120,240,255,0)');
    g.addColorStop(0.5, `rgba(230,255,255,${0.12 * (1 - f) * master})`);
    g.addColorStop(1, 'rgba(120,240,255,0)');
    s.fillStyle = g;
    s.fillRect(CX - w / 2, 500, w, 1.4);
  }

  // diagonal blade, following the signature slash
  if (q < 0.55) {
    const f = q / 0.55;
    const len = 480 + 940 * easeOutCubic(f);
    const ang = Math.atan2(672 - 338, 1122 - 812);
    const dx = Math.cos(ang) * len / 2, dy = Math.sin(ang) * len / 2;
    const g = s.createLinearGradient(MARK_CX - dx, MARK_CY - dy, MARK_CX + dx, MARK_CY + dy);
    g.addColorStop(0, 'rgba(120,240,255,0)');
    g.addColorStop(0.44, `rgba(120,240,255,${0.10 * (1 - f) * master})`);
    g.addColorStop(0.5, `rgba(255,255,255,${0.32 * (1 - f) * master})`);
    g.addColorStop(0.56, `rgba(120,240,255,${0.10 * (1 - f) * master})`);
    g.addColorStop(1, 'rgba(120,240,255,0)');
    s.strokeStyle = g;
    s.lineWidth = 1.5;
    s.beginPath(); s.moveTo(MARK_CX - dx, MARK_CY - dy); s.lineTo(MARK_CX + dx, MARK_CY + dy); s.stroke();
  }
  s.restore();

  // late node pulse chain
  for (let i = 0; i < NODES.length; i++) {
    const pt = 4.35 + i * 0.5;
    const pq = (t - pt) / 1.25;
    if (pq <= 0 || pq >= 1) continue;
    const n = NODES[i];
    s.save();
    s.globalCompositeOperation = 'screen';
    s.strokeStyle = `rgba(120, 238, 255, ${0.30 * (1 - pq) * master})`;
    s.lineWidth = 1;
    s.beginPath(); s.arc(n.x, n.y, 34 + easeOutCubic(pq) * 96, 0, 6.2832); s.stroke();
    s.restore();
  }
}

function drawHUD(t, master) {
  const p = smooth((t - TL.hud) / 0.7) * (1 - smooth((t - TL.fade) / 0.3));
  if (p <= 0) return;
  const a = p * master;

  s.save();
  s.font = '400 9px "Cascadia Mono", Consolas, monospace';
  s.textBaseline = 'alphabetic';

  // corner brackets
  const brackets = [[52, 52, 1, 1], [1868, 52, -1, 1], [52, 1028, 1, -1], [1868, 1028, -1, -1]];
  s.strokeStyle = `rgba(120, 220, 238, ${0.30 * a})`;
  s.lineWidth = 1;
  for (const [x, y, sx, sy] of brackets) {
    s.beginPath();
    s.moveTo(x, y + sy * 26);
    s.lineTo(x, y);
    s.lineTo(x + sx * 26, y);
    s.stroke();
  }

  // top left
  s.fillStyle = `rgba(198, 242, 250, ${0.72 * a})`;
  s.font = '600 12px Bahnschrift, "Segoe UI", sans-serif';
  tracked(s, 'NEXUS', 74, 82, 4.2);
  s.font = '400 8.5px "Cascadia Mono", Consolas, monospace';
  s.fillStyle = `rgba(140, 220, 235, ${0.40 * a})`;
  tracked(s, 'BOOT SEQUENCE / 07', 74, 100, 1.6);

  // top right
  s.textAlign = 'right';
  s.fillStyle = `rgba(170, 236, 248, ${0.58 * a})`;
  s.font = '400 9.5px "Cascadia Mono", Consolas, monospace';
  s.fillText(`T+ ${pad2(Math.floor(t / 60))}:${pad2(Math.floor(t % 60))}.${pad2(Math.floor((t % 1) * 100))}`, 1846, 82);
  s.fillStyle = `rgba(140, 220, 235, ${0.36 * a})`;
  s.font = '400 8.5px "Cascadia Mono", Consolas, monospace';
  tracked(s, `BUILD ${BUILD}`, 1846, 100, 1.4, 'right');
  s.textAlign = 'left';

  // top centre micro label
  s.fillStyle = `rgba(130, 214, 230, ${0.30 * a})`;
  s.font = '400 7.5px "Cascadia Mono", Consolas, monospace';
  tracked(s, 'NEURAL INTERFACE / SIGNAL ACQUIRED', CX, 76, 2.4, 'center');

  // bottom left
  const linkCount = clamp(Math.floor((t - TL.nodes) / 0.13) + 1, 0, 4);
  s.fillStyle = `rgba(140, 222, 236, ${0.42 * a})`;
  s.font = '400 8.5px "Cascadia Mono", Consolas, monospace';
  tracked(s, `LINK ${pad2(linkCount)}/04`, 74, 1006, 1.4);
  s.fillStyle = `rgba(140, 222, 236, ${0.32 * a})`;
  tracked(s, t > 3.65 ? 'CORE STABLE' : 'CORE SPOOLING', 74, 1020, 1.4);

  // bottom right
  s.fillStyle = `rgba(130, 210, 226, ${0.30 * a})`;
  s.textAlign = 'right';
  tracked(s, '© 2026 NEXUS SYSTEMS', 1846, 1018, 1.2, 'right');
  s.textAlign = 'left';

  // ------------------------------------------------------------------
  // status + progress
  // ------------------------------------------------------------------
  const phases = [
    [0.00, 'INITIALIZING'],
    [1.00, 'ASSEMBLING IDENTITY'],
    [2.06, 'SYNCING NODES'],
    [3.40, 'SYSTEM ONLINE'],
    [4.30, 'CONNECTED']
  ];
  let label = phases[0][1];
  for (const [pt, txt] of phases) if (t >= pt) label = txt;
  let statusA = 1;
  for (const [pt] of phases) if (Math.abs(t - pt) < 0.09) statusA = 0.25;

  s.save();
  s.font = '400 10.5px "Cascadia Mono", Consolas, monospace';
  s.fillStyle = `rgba(178, 242, 252, ${0.88 * a * statusA})`;
  tracked(s, label, CX, 944, 5.2, 'center');

  const prog = smooth(clamp((t - 0.62) / 2.9));
  const bx = 820, by = 968, bw = 280;
  s.fillStyle = `rgba(180, 240, 250, ${0.10 * a})`;
  s.fillRect(bx, by, bw, 1);
  for (let i = 0; i <= 10; i++) {
    s.fillStyle = `rgba(150, 230, 244, ${0.14 * a})`;
    s.fillRect(bx + i * bw / 10, by + 5, 1, i % 5 === 0 ? 5 : 3);
  }
  if (prog > 0) {
    const fw = bw * prog;
    const g = s.createLinearGradient(bx, 0, bx + bw, 0);
    g.addColorStop(0, `rgba(70, 205, 232, ${0.55 * a})`);
    g.addColorStop(0.7, `rgba(180, 248, 255, ${0.95 * a})`);
    g.addColorStop(1, `rgba(255,255,255, ${1.0 * a})`);
    s.fillStyle = g;
    s.fillRect(bx, by, fw, 1.3);
    s.globalCompositeOperation = 'screen';
    s.fillStyle = `rgba(120, 238, 255, ${0.25 * a})`;
    s.fillRect(bx + fw - 1, by - 1, 1, 3.3);
    s.globalCompositeOperation = 'source-over';
  }
  s.font = '400 8px "Cascadia Mono", Consolas, monospace';
  s.fillStyle = `rgba(180, 240, 250, ${0.34 * a})`;
  s.textAlign = 'right';
  s.fillText(`${String(Math.round(prog * 100)).padStart(3, '0')}%`, 1128, 971);
  s.textAlign = 'left';
  s.restore();

  s.restore();
}

function drawTexture(t, master) {
  // scanlines
  if (T.scan) {
    s.save();
    s.globalAlpha = 0.5 * master;
    s.fillStyle = s.createPattern(T.scan, 'repeat');
    s.fillRect(0, 0, W, H);
    s.restore();
  }
  // film grain (animated at 12 fps, deterministic)
  if (T.noise) {
    const fi = Math.floor(t * 12);
    const ox = Math.floor(hash1(fi * 1.7) * 180);
    const oy = Math.floor(hash1(fi * 4.3) * 180);
    s.save();
    s.globalCompositeOperation = 'screen';
    s.globalAlpha = 0.16 * master;
    s.fillStyle = s.createPattern(T.noise, 'repeat');
    s.translate(-ox, -oy);
    s.fillRect(0, 0, W + 180, H + 180);
    s.restore();
  }
}

/* ------------------------------ render ---------------------------- */

function render(t) {
  t = clamp(t, 0, DUR);
  const master = 1;

  s.setTransform(1, 0, 0, 1, 0, 0);
  s.globalAlpha = 1;
  s.globalCompositeOperation = 'source-over';
  s.filter = 'none';
  s.setLineDash([]);
  s.shadowBlur = 0;

  drawBackdrop(t, master);
  drawPowerLine(t, master);
  drawGrid(t, master);
  drawRings(t, master);
  drawTraces(t, master);
  drawCore(t, master);
  drawDust(t, master);
  drawSparks(t, master);
  drawNodeMarkers(t, master);
  drawAssembly(t, master);
  drawSlashCharge(t, master);
  drawShine(t, master);
  drawImpact(t, master);
  drawSweep(t, master);
  drawWordmark(t, master);
  drawHUD(t, master);
  drawTexture(t, master);
  present(t);
}

function glitchAt(t) {
  const w1 = t >= TL.glitch && t < TL.glitch + 0.13;
  const w2 = t >= 5.32 && t < 5.40;
  if (!w1 && !w2) return 0;
  return w1 ? 0.55 : 0.22;
}

function present(t) {
  const fade = 1 - smooth((t - TL.fade) / 0.42);
  out.setTransform(1, 0, 0, 1, 0, 0);
  out.globalAlpha = 1;
  out.fillStyle = '#000';
  out.fillRect(0, 0, cv.width, cv.height);

  const sc = view.s;
  const dx = view.ox, dy = view.oy;
  const gl = glitchAt(t);

  out.imageSmoothingEnabled = true;
  out.imageSmoothingQuality = 'high';

  if (gl <= 0) {
    out.globalAlpha = fade;
    out.drawImage(scene, dx, dy, W * sc, H * sc);
    out.globalAlpha = 1;
    return;
  }

  // sliced glitch, deterministic per frame
  const frame = Math.floor(t * 60);
  const r = mulberry32(1000 + frame * 17);
  out.save();
  out.setTransform(sc, 0, 0, sc, dx, dy);
  out.globalAlpha = fade;
  out.drawImage(scene, 0, 0);
  out.globalAlpha = 1;

  const count = 11;
  for (let i = 0; i < count; i++) {
    const y = Math.floor(r() * H);
    const h = 3 + Math.floor(r() * 46);
    const off = (r() - 0.5) * 46 * gl;
    out.drawImage(scene, 0, y, W, h, off, y, W, h);
    if (r() > 0.55) {
      out.fillStyle = `rgba(120, 240, 255, ${0.18 * gl})`;
      out.fillRect(0, y, W, 1);
    }
    if (r() > 0.7) {
      out.fillStyle = `rgba(255, 60, 120, ${0.12 * gl})`;
      out.fillRect(0, y + h, W, 1);
    }
  }
  // a couple of data blocks
  for (let i = 0; i < 3; i++) {
    const bx = r() * W, by = r() * H, bw = 30 + r() * 150, bh = 2 + r() * 5;
    out.fillStyle = `rgba(200, 250, 255, ${0.22 * gl})`;
    out.fillRect(bx, by, bw, bh);
  }
  out.restore();
}

/* ------------------------------- boot ----------------------------- */

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(window.innerWidth * dpr));
  const h = Math.max(1, Math.round(window.innerHeight * dpr));
  if (cv.width !== w || cv.height !== h) {
    cv.width = w; cv.height = h;
  }
  view.dpr = dpr;
  view.s = Math.min(w / W, h / H);
  view.ox = (w - W * view.s) / 2;
  view.oy = (h - H * view.s) / 2;
  if (window.__frozen != null) render(window.__frozen);
}

async function boot() {
  const E = window.__NEXUS_EMBED__ || {};
  await Promise.all([
    loadImage(E.mark || 'assets/mark.png').then(i => IMAGES.mark = i),
    loadImage(E.word || 'assets/word.png').then(i => IMAGES.word = i),
    loadImage(E.edges || 'assets/mark-edges.png').then(i => IMAGES.edges = i)
  ]);
  await document.fonts.ready;

  T.markCyan = tinted(IMAGES.mark, 'rgb(88, 238, 255)');
  T.markMagenta = tinted(IMAGES.mark, 'rgb(255, 58, 120)');
  T.edges = tinted(IMAGES.edges, 'rgb(86, 226, 255)');
  T.glow = makeGlow();
  T.grid = makeGrid();
  T.noise = makeNoise();
  T.scan = makeScanlines();

  T.fx = document.createElement('canvas');
  T.fx.width = IMAGES.mark.width;
  T.fx.height = IMAGES.mark.height;

  resize();
  window.__ready = true;

  const params = new URLSearchParams(location.search);
  const fixed = params.has('t') ? parseFloat(params.get('t')) : null;
  const speed = Math.max(0.2, Math.min(3, parseFloat(params.get('speed') || '1.35')));
  const loop = params.get('loop') === '1';
  const clean = params.get('clean') !== '0';
  if (clean) document.body.classList.add('clean');

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  window.__setTime = v => {
    window.__frozen = clamp(parseFloat(v) || 0, 0, DUR);
    window.__halted = true;
    render(window.__frozen);
    return window.__frozen;
  };
  window.__resume = () => {
    window.__frozen = null;
    window.__halted = false;
    start = performance.now();
    requestAnimationFrame(frame);
  };
  window.__duration = DUR;

  if (fixed != null || reduced) {
    window.__frozen = fixed != null ? clamp(fixed, 0, DUR) : 4.9;
    render(window.__frozen);
    return;
  }

  let start = performance.now();
  let paused = false;
  let pausedAt = 0;
  const pauseBtn = document.getElementById('btn-pause');
  const replayBtn = document.getElementById('btn-replay');

  function frame(now) {
    if (window.__halted) return;
    let t;
    if (paused) t = pausedAt;
    else {
      t = ((now - start) / 1000) * speed;
      if (loop) t = t % DUR;
      else t = Math.min(t, 6.85);
    }
    render(t);
    requestAnimationFrame(frame);
  }

  window.__pause = () => {
    if (!paused) { pausedAt = ((performance.now() - start) / 1000 * speed) % DUR; paused = true; }
    else { start = performance.now() - pausedAt / speed * 1000; paused = false; }
    if (pauseBtn) pauseBtn.textContent = paused ? 'Resume' : 'Pause';
  };
  window.__replay = () => {
    const wasHalted = window.__halted;
    window.__halted = false;
    window.__frozen = null;
    start = performance.now();
    paused = false;
    if (pauseBtn) pauseBtn.textContent = 'Pause';
    if (wasHalted) requestAnimationFrame(frame);
  };

  if (pauseBtn) pauseBtn.addEventListener('click', window.__pause);
  if (replayBtn) replayBtn.addEventListener('click', window.__replay);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); window.__pause(); }
    if (e.key === 'r' || e.key === 'R') window.__replay();
  });
  window.addEventListener('resize', resize);

  requestAnimationFrame(frame);
}

boot().catch(err => {
  console.error(err);
  document.body.innerHTML = '<div style="color:#8ff;font:14px monospace;padding:40px">NEXUS boot failed: ' + err.message + '</div>';
});

})();
</script>
