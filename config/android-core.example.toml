# 增量示例。合并到现有 Core 配置，不作为完整配置直接启动。
# 顶层 origins 追加 https://app.nexus.local，保留原来源。
# 登记独立身份后，替换下方示例 UUID；令牌只在环境变量/手机加密存储中。
[nodes.'11111111-1111-4111-8111-111111111111']
tools = ['android.device_status@1', 'android.notification_digest@1']
roots = ['android:device', 'android:notifications']
# 启用文件接收时分别追加 filesystem.receive@1 / workspace，并给 owner 和
# 此 Node 独立授予接收权限；Android workspace 只映射 App 私有收件箱。
resource_version = 1

# 只有 Core 已配置语音提供方且明确允许这台手机时才启用。
[nodes.'11111111-1111-4111-8111-111111111111'.voice]
enabled = false
features = ['capture', 'playback', 'streaming_asr', 'streaming_tts']
max_session_seconds = 1800
