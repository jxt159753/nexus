
[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS - One Mind, Many Bodies"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.22.1",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "websockets==17.1",
    "httpx2==2.13.1",
]

[project.optional-dependencies]
images = [
    "Pillow==13.0.0",
]
plugins = [
    "pywinpty==3.1.0; sys_platform == 'win32'",
]
voice = [
    "numpy==2.5.4",
    "sounddevice==0.5.6",
    "samplerate==0.2.4",
    "pywebrtc-audio==0.2.0; sys_platform == 'win32'",
]
voice-wake = [
    "sherpa-onnx==1.13.8; sys_platform == 'win32'",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus*"]

[tool.setuptools.package-data]
"nexus.core.storage" = ["migrations/*.sql"]
"nexus.node" = ["migrations/*.sql", "tools/*.ps1"]
"nexus.plugins" = ["emulator_assets/*.apk", "emulator_assets/*.json"]
"nexus.web" = ["*.html", "*.css", "*.js", "app/*", "app/vendor/*", "app/vendor/addons/postprocessing/*", "app/vendor/addons/shaders/*", "app/vendor/markdown/*", "app/vendor/mediapipe/*", "app/vendor/mediapipe/wasm/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
