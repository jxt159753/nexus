
[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS - One Mind, Many Bodies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.22.1",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "websockets==17.1",
    "httpx2==2.13.1",
]

[project.optional-dependencies]
images = [
    "Pillow==13.0.0",
]
plugins = [
    "pywinpty==3.1.0; sys_platform == 'win32'",
]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus*"]

[tool.setuptools.package-data]
"nexus.core.storage" = ["migrations/*.sql"]
"nexus.node" = ["migrations/*.sql", "tools/*.ps1"]
"nexus.web" = ["*.html", "*.css", "*.js", "app/*", "app/vendor/*", "app/vendor/addons/postprocessing/*", "app/vendor/addons/shaders/*", "app/vendor/markdown/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
